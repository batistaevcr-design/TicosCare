<title>TicosCare 🐾</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#F4F4FB;--card:#FFFFFF;--border:#DDD9F0;
  --sage:#8B8FC8;--sage-light:#CDD0EE;--sage-dark:#4A4A99;
  --terra:#9B7CC8;--terra-light:#E4DCEF;--terra-dark:#6B4F9E;
  --text:#2E2B45;--text-muted:#7B78A8;--text-light:#B0ADCC;
  --gold:#7B6BB5;--apolo:#5B7AC8;--apolo-light:#A8BCE8;
  --danger:#C0392B;--danger-bg:#FEECEC;
  --brand:#2E2B6E;--brand-mid:#6B5FC8;--brand-light:#ECEAF8;
  --radius:18px;--radius-sm:12px;
  --nav-h:70px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --shadow:0 1px 8px rgba(61,54,48,.08);--t:.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
button,input{font-family:inherit;}
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden;}

/* ── TOP BAR ─────────────────────── */
.topbar{background:var(--card);padding:14px 18px 10px;padding-top:calc(14px + var(--safe-t));border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;z-index:10;}
.topbar__brand{display:flex;align-items:center;gap:9px;}
.topbar__icon{width:26px;height:26px;flex-shrink:0;}
.topbar__icon img{width:100%;height:100%;object-fit:contain;display:block;}
.topbar__name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--sage-dark);}
.topbar__pill{background:var(--sage-light);color:var(--sage-dark);font-size:.68rem;font-weight:700;padding:4px 12px;border-radius:99px;white-space:nowrap;}

/* ── INSTALL BANNER ──────────────── */
.install-banner{display:none;background:var(--brand);color:#fff;padding:10px 16px;align-items:center;gap:10px;flex-shrink:0;}
.install-banner.show{display:flex;}
.install-banner__text{flex:1;font-size:.78rem;line-height:1.3;}
.install-banner__text strong{display:block;font-size:.82rem;}
.install-banner__btn{background:#fff;color:var(--brand);border:none;padding:7px 14px;border-radius:99px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.install-banner__close{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0;}

/* ── SCROLL ──────────────────────── */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 16px);scroll-behavior:smooth;}
.scroll-area::-webkit-scrollbar{display:none;}

/* ── BOTTOM NAV ──────────────────── */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-b);z-index:100;height:calc(var(--nav-h) + var(--safe-b));}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;gap:3px;border:none;background:transparent;cursor:pointer;}
.nav-btn__icon{font-size:20px;transition:transform var(--t);line-height:1;}
.nav-btn__label{font-size:.62rem;font-weight:500;color:var(--text-light);transition:color var(--t);}
.nav-btn.active .nav-btn__label{color:var(--brand);font-weight:700;}
.nav-btn.active .nav-btn__icon{transform:scale(1.15);}
.nav-btn:active .nav-btn__icon{transform:scale(.9);}

/* ── SECTIONS ────────────────────── */
.section{display:none;}.section.active{display:block;}

/* ── TODAY BANNER ────────────────── */
.today-banner{background:linear-gradient(135deg,#ECEAF8 0%,#E4DCEF 100%);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.today-banner__icon{width:36px;height:36px;flex-shrink:0;}
.today-banner__icon img{width:100%;height:100%;object-fit:contain;}
.today-banner__label{font-size:.62rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;}
.today-banner__date{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;line-height:1.25;margin:2px 0;}
.today-banner__sub{font-size:.73rem;color:var(--text-muted);}

/* ── DOG CARDS ───────────────────── */
.dog-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.dog-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform var(--t);}
.dog-card:active{transform:scale(.98);}
.dog-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.dog-card--paco::before{background:var(--terra);}
.dog-card--apolo::before{background:var(--apolo);}
.dog-card--gaia::before{background:var(--sage);}
.dog-card__avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--border);overflow:hidden;flex-shrink:0;background:var(--bg);}
.dog-card__avatar img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.dog-card__info{flex:1;min-width:0;}
.dog-card__name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:2px;}
.dog-card__tasks{font-size:.72rem;color:var(--text-muted);margin-bottom:6px;}

/* ── PROGRESS BAR ────────────────── */
.progress-bar{background:var(--bg);border-radius:99px;height:5px;overflow:hidden;margin-bottom:3px;}
.progress-bar__fill{height:100%;border-radius:99px;transition:width .5s ease;}
.progress-bar__fill--paco{background:linear-gradient(90deg,#9B7CC8,#C8B8E8);}
.progress-bar__fill--apolo{background:linear-gradient(90deg,var(--apolo),var(--apolo-light));}
.progress-bar__fill--gaia{background:linear-gradient(90deg,#8B8FC8,#CDD0EE);}
.progress-bar__pct{font-size:.7rem;font-weight:600;color:var(--text-muted);}

/* ── OVERALL ─────────────────────── */
.overall-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
.overall-card__header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.overall-card__title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;}
.overall-card__pct{font-size:1.2rem;font-weight:700;color:var(--brand-mid);}
.overall-bar{background:var(--bg);border-radius:99px;height:8px;overflow:hidden;}
.overall-bar__fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#8B8FC8,#4A4A99);transition:width .5s ease;}

/* ── METRICS ─────────────────────── */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.metric-card{background:var(--card);border-radius:var(--radius-sm);padding:14px;text-align:center;box-shadow:var(--shadow);}
.metric-card__value{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--brand-mid);line-height:1;margin-bottom:4px;}
.metric-card__label{font-size:.67rem;color:var(--text-muted);line-height:1.35;}

/* ── FILTERS ─────────────────────── */
.filters-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
.filters-scroll::-webkit-scrollbar{display:none;}
.chip{padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);font-size:.75rem;font-weight:500;color:var(--text-muted);white-space:nowrap;flex-shrink:0;cursor:pointer;transition:all var(--t);}
.chip.active{border-color:var(--brand-mid);background:var(--brand-light);color:var(--brand);font-weight:700;}
.chip:active{transform:scale(.95);}

/* ── SEARCH ──────────────────────── */
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap__icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.search-wrap__input{width:100%;padding:11px 16px 11px 42px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);font-size:.9rem;color:var(--text);outline:none;-webkit-appearance:none;transition:border-color var(--t);}
.search-wrap__input:focus{border-color:var(--brand-mid);}

/* ── DAY CARDS ───────────────────── */
.day-card{background:var(--card);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);animation:fadeUp .25s ease both;}
.day-card--completed{border:1.5px solid var(--sage-light);}
.day-card--today{border:1.5px solid var(--brand-mid);}
.day-card__header{padding:14px 16px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none;transition:background var(--t);}
.day-card__header:active{background:var(--bg);}
.day-card__num{font-size:.62rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;}
.day-card__date{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;margin:2px 0;}
.day-card__sub{font-size:.7rem;color:var(--text-muted);}
.day-card__badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto;flex-shrink:0;}
.day-card__chevron{font-size:11px;color:var(--text-light);margin-top:2px;flex-shrink:0;transition:transform .2s ease;}
.day-card--expanded .day-card__chevron{transform:rotate(180deg);}
.day-card__body{display:none;border-top:1px solid var(--border);}
.day-card--expanded .day-card__body{display:block;}

/* ── BADGES ──────────────────────── */
.badge{font-size:.63rem;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.badge--done{background:var(--sage-light);color:var(--sage-dark);}
.badge--today{background:var(--brand-mid);color:#fff;}
.badge--special{background:var(--terra-light);color:var(--terra-dark);}

/* ── DAY ACTIONS ─────────────────── */
.day-actions{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);}
.day-actions__btn{padding:7px 12px;border-radius:99px;border:1.5px solid var(--border);background:transparent;font-size:.72rem;font-weight:500;color:var(--text-muted);cursor:pointer;transition:background var(--t);}
.day-actions__btn:active{background:var(--bg);}

/* ── DOG SECTION ─────────────────── */
.dog-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.dog-section:last-child{border-bottom:none;}
.dog-section__header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.dog-section__avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--border);flex-shrink:0;background:var(--bg);}
.dog-section__avatar img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.dog-section__name{font-weight:600;font-size:.9rem;flex:1;}
.dog-section__badge-ok{font-size:.63rem;background:var(--brand-light);color:var(--brand);padding:2px 8px;border-radius:99px;font-weight:700;}
.dog-section__count{font-size:.7rem;color:var(--text-muted);}

/* ── TASK LIST ───────────────────── */
.task-list{display:flex;flex-direction:column;gap:6px;}
.task-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;min-height:44px;transition:background var(--t);}
.task-item:active{background:var(--border);}
.task-item--done{opacity:.55;}
.task-item--done .task-item__label{text-decoration:line-through;color:var(--text-muted);}
.task-item__check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;transition:all .2s ease;}
.task-item--done .task-item__check{background:var(--brand-mid);border-color:var(--brand-mid);color:#fff;}
.task-item__emoji{font-size:16px;flex-shrink:0;}
.task-item__label{font-size:.85rem;line-height:1.3;}

/* ── WEEKLY ──────────────────────── */
.week-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.week-card__title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;margin-bottom:12px;}
.week-card__stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center;}
.week-stat__value{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--brand-mid);}
.week-stat__label{font-size:.63rem;color:var(--text-muted);}
.week-day-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.week-day-row:last-child{border-bottom:none;}
.week-day-row__num{color:var(--text-muted);font-size:.68rem;}
.week-day-row__right{display:flex;align-items:center;gap:8px;}
.week-day-row__count{color:var(--text-muted);font-size:.75rem;}

/* ── EMPTY ───────────────────────── */
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted);}
.empty-state__icon{font-size:44px;margin-bottom:12px;}
.empty-state__text{font-size:.9rem;}

/* ── MODAL ───────────────────────── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:430px;animation:slideUp .25s ease;}
.modal-sheet__handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px;}
.modal-sheet__title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:16px;text-align:center;}
.sheet-btn{width:100%;padding:14px;border-radius:14px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:10px;transition:opacity var(--t);}
.sheet-btn:active{opacity:.75;}
.sheet-btn--primary{background:var(--brand-mid);color:#fff;}
.sheet-btn--danger{background:var(--danger-bg);color:var(--danger);}
.sheet-btn--cancel{background:var(--bg);color:var(--text-muted);}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
</style>
</head>

function save(){try{localStorage.setItem(SK.tasks,JSON.stringify(state.tasks));localStorage.setItem(SK.photos,JSON.stringify(state.photos));localStorage.setItem(SK.filter,state.filter);localStorage.setItem(SK.expanded,JSON.stringify([...expandedDays]));}catch(e){}}
function load(){try{const t=localStorage.getItem(SK.tasks);if(t)Object.assign(state.tasks,JSON.parse(t));const p=localStorage.getItem(SK.photos);if(p)Object.assign(state.photos,JSON.parse(p));const f=localStorage.getItem(SK.filter);if(f)state.filter=f;const e=localStorage.getItem(SK.expanded);if(e)expandedDays=new Set(JSON.parse(e));}catch(e){}}
function allDays(){return Array.from({length:CONFIG.totalDays},(_,i)=>{const d=new Date(CONFIG.start);d.setDate(d.getDate()+i);return d;});}
function dk(d){return d.toISOString().split('T')[0];}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function isToday(d){const n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isThisWeek(d){const t=new Date(),mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);return d>=mon&&d<=sun;}
function tasksForDay(d){const t=[...DAILY_TASKS];const w=WEEKLY_TASKS[d.getDay()];if(w)t.push(w);return t;}
function tk(d,dog,task){return dk(d)+'_'+dog+'_'+task;}
function dayProg(date){const tasks=tasksForDay(date);const total=DOGS.length*tasks.length;const done=DOGS.reduce((a,dog)=>a+tasks.filter(t=>state.tasks[tk(date,dog.id,t.id)]).length,0);return{done,total};}
function dogProg(dogId){let total=0,done=0;allDays().forEach(d=>{const tasks=tasksForDay(d);total+=tasks.length;done+=tasks.filter(t=>state.tasks[tk(d,dogId,t.id)]).length;});return{total,done,pct:total?Math.round(done/total*100):0};}
function getStats(){const days=allDays();let tt=0,dt=0,dc=0,baths=0,ears=0;days.forEach(d=>{const tasks=tasksForDay(d);const cnt=DOGS.length*tasks.length;tt+=cnt;const done=DOGS.reduce((a,dog)=>a+tasks.filter(t=>state.tasks[tk(d,dog.id,t.id)]).length,0);dt+=done;if(done===cnt)dc++;if(d.getDay()===5)DOGS.forEach(dog=>{if(state.tasks[tk(d,dog.id,'drybath')])baths++;});if(d.getDay()===3)DOGS.forEach(dog=>{if(state.tasks[tk(d,dog.id,'ears')])ears++;});});const today=new Date();return{tt,dt,dc,dr:days.filter(d=>d>=today).length,baths:Math.floor(baths/3),ears:Math.floor(ears/3)};}
function photoSrc(dogId){return state.photos[dogId]||DEFAULT_PHOTOS[dogId];}
function openPhotoModal(dogId){currentDog=dogId;const dog=DOGS.find(d=>d.id===dogId);document.getElementById('modalTitle').textContent='Foto de '+dog.name;document.getElementById('photoModal').classList.add('open');}
function closeModal(){document.getElementById('photoModal').classList.remove('open');currentDog=null;}
function removePhoto(){if(!currentDog)return;delete state.photos[currentDog];save();closeModal();renderAll();}
function toggleTask(dkStr,dogId,taskId){const key=dkStr+'_'+dogId+'_'+taskId;state.tasks[key]=!state.tasks[key];save();renderAll();}
function markAllDay(dkStr,val){const date=new Date(dkStr+'T12:00:00');tasksForDay(date).forEach(t=>DOGS.forEach(dog=>{state.tasks[tk(date,dog.id,t.id)]=val;}));save();renderAll();}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('sec-'+tab).classList.add('active');document.getElementById('btn-'+tab).classList.add('active');document.getElementById('scrollArea').scrollTop=0;if(tab==='rotina')renderDays();if(tab==='semanal')renderWeekly();}
function toggleExpand(dkStr){if(expandedDays.has(dkStr))expandedDays.delete(dkStr);else expandedDays.add(dkStr);save();if(activeTab==='rotina')renderDays();}
function setFilter(f){state.filter=f;save();renderDays();}
function renderDashboard(){const days=allDays(),todayDay=days.find(d=>isToday(d)),s=getStats();document.getElementById('topPill').textContent='Dia '+s.dc+' de '+CONFIG.totalDays;if(todayDay){const num=days.indexOf(todayDay)+1;document.getElementById('todayDate').textContent='Dia '+num+' — '+WEEKDAYS[todayDay.getDay()]+', '+fmt(todayDay);const{done,total}=dayProg(todayDay);document.getElementById('todayProg').textContent=done+' de '+total+' tarefas concluídas hoje';}else{document.getElementById('todayDate').textContent='Fora do período da rotina';document.getElementById('todayProg').textContent='05/06 → 22/07/2026';}document.getElementById('dogCards').innerHTML=DOGS.map(dog=>{const{done,total,pct}=dogProg(dog.id);return`<div class="dog-card dog-card--${dog.id}" onclick="openPhotoModal('${dog.id}')"><div class="dog-card__avatar"><img src="${photoSrc(dog.id)}" alt="${dog.name}"></div><div class="dog-card__info"><div class="dog-card__name">${dog.name}</div><div class="dog-card__tasks">${done}/${total} tarefas</div><div class="progress-bar"><div class="progress-bar__fill progress-bar__fill--${dog.id}" style="width:${pct}%"></div></div><div class="progress-bar__pct">${pct}%</div></div></div>`;}).join('');const pct=s.tt?Math.round(s.dt/s.tt*100):0;document.getElementById('ovPct').textContent=pct+'%';document.getElementById('ovFill').style.width=pct+'%';document.getElementById('metricsGrid').innerHTML=[{v:s.tt,l:'Tarefas previstas'},{v:s.dt,l:'Tarefas concluídas'},{v:s.dc,l:'Dias concluídos'},{v:s.dr,l:'Dias restantes'},{v:s.baths,l:'Banhos a seco'},{v:s.ears,l:'Limpezas de orelha'}].map(m=>`<div class="metric-card"><div class="metric-card__value">${m.v}</div><div class="metric-card__label">${m.l}</div></div>`).join('');}
function renderFilters(){document.getElementById('filtersRow').innerHTML=FILTERS.map(f=>`<div class="chip ${state.filter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}</div>`).join('');}
function renderDays(){renderFilters();const container=document.getElementById('daysContainer');const search=document.getElementById('searchInput').value.toLowerCase().trim();const allD=allDays();let days=[...allD];const fns={today:d=>isToday(d),week:d=>isThisWeek(d),pending:d=>{const p=dayProg(d);return p.done<p.total;},done:d=>{const p=dayProg(d);return p.done===p.total&&p.total>0;}};if(fns[state.filter])days=days.filter(fns[state.filter]);if(search)days=days.filter(d=>fmt(d).includes(search)||WEEKDAYS[d.getDay()].toLowerCase().includes(search));if(!days.length){container.innerHTML='<div class="empty-state"><div class="empty-state__icon">🐾</div><div class="empty-state__text">Nenhum dia encontrado.</div></div>';return;}container.innerHTML=days.map((date,idx)=>buildDayCard(date,allD,idx)).join('');}
function buildDayCard(date,allD,animIdx){const num=allD.indexOf(date)+1,dkStr=dk(date);const tasks=tasksForDay(date);const{done,total}=dayProg(date);const pct=total?Math.round(done/total*100):0;const comp=done===total&&total>0,tod=isToday(date),exp=expandedDays.has(dkStr);const cls=['day-card',comp?'day-card--completed':'',tod?'day-card--today':'',exp?'day-card--expanded':''].filter(Boolean).join(' ');const badges=[];if(tod)badges.push('<span class="badge badge--today">⭐ Hoje</span>');if(comp)badges.push('<span class="badge badge--done">✅ Concluído</span>');if(date.getDay()===5)badges.push('<span class="badge badge--special">✨ Banho a seco</span>');if(date.getDay()===3)badges.push('<span class="badge badge--special">👂 Orelhas</span>');const dogSects=DOGS.map(dog=>{const dogDone=tasks.filter(t=>state.tasks[tk(date,dog.id,t.id)]).length;const dogComp=dogDone===tasks.length;const taskItems=tasks.map(t=>{const isDone=!!state.tasks[tk(date,dog.id,t.id)];return`<div class="task-item ${isDone?'task-item--done':''}" onclick="toggleTask('${dkStr}','${dog.id}','${t.id}')"><div class="task-item__check">${isDone?'✓':''}</div><span class="task-item__emoji">${t.emoji}</span><span class="task-item__label">${t.label}</span></div>`;}).join('');return`<div class="dog-section"><div class="dog-section__header"><div class="dog-section__avatar"><img src="${photoSrc(dog.id)}" alt="${dog.name}"></div><div class="dog-section__name">${dog.name}</div>${dogComp?'<span class="dog-section__badge-ok">🏆 Tudo certo!</span>':`<span class="dog-section__count">${dogDone}/${tasks.length}</span>`}</div><div class="task-list">${taskItems}</div></div>`;}).join('');return`<div class="${cls}" id="day-${dkStr}" style="animation-delay:${Math.min(animIdx,8)*.03}s"><div class="day-card__header" onclick="toggleExpand('${dkStr}')"><div><div class="day-card__num">Dia ${num}</div><div class="day-card__date">${WEEKDAYS[date.getDay()]}, ${fmt(date)}</div><div class="day-card__sub">${done}/${total} tarefas · ${pct}%</div></div><div class="day-card__badges">${badges.join('')}</div><div class="day-card__chevron">▼</div></div><div class="day-card__body"><div class="day-actions"><button class="day-actions__btn" onclick="markAllDay('${dkStr}',true)">✅ Marcar todas</button><button class="day-actions__btn" onclick="markAllDay('${dkStr}',false)">🗑️ Limpar</button></div>${dogSects}</div></div>`;}
function renderWeekly(){const days=allDays();const weeks=[];let w=[];days.forEach((d,i)=>{w.push(d);if(d.getDay()===0||i===days.length-1){weeks.push([...w]);w=[];}});if(w.length)weeks.push(w);document.getElementById('weeklyContainer').innerHTML=weeks.map((wd,wi)=>{let tot=0,don=0;wd.forEach(d=>{const p=dayProg(d);tot+=p.total;don+=p.done;});const pct=tot?Math.round(don/tot*100):0;const dayRows=wd.map(d=>{const num=days.indexOf(d)+1,p=dayProg(d);const comp=p.done===p.total&&p.total>0,tod=isToday(d);return`<div class="week-day-row" style="${tod?'font-weight:600':''}"><div><span class="week-day-row__num">Dia ${num} · </span>${WEEKDAYS[d.getDay()].split('-')[0]}, ${fmt(d)}</div><div class="week-day-row__right"><span class="week-day-row__count">${p.done}/${p.total}</span>${comp?'<span>✅</span>':''}${tod?'<span>⭐</span>':''}</div></div>`;}).join('');return`<div class="week-card"><div class="week-card__title">Semana ${wi+1} · ${fmt(wd[0])} → ${fmt(wd[wd.length-1])}</div><div class="week-card__stats"><div><div class="week-stat__value">${pct}%</div><div class="week-stat__label">Concluído</div></div><div><div class="week-stat__value">${don}</div><div class="week-stat__label">Feitas</div></div><div><div class="week-stat__value">${tot-don}</div><div class="week-stat__label">Pendentes</div></div></div><div class="overall-bar" style="margin-bottom:14px"><div class="overall-bar__fill" style="width:${pct}%"></div></div>${dayRows}</div>`;}).join('');}
function renderAll(){renderDashboard();if(activeTab==='rotina')renderDays();if(activeTab==='semanal')renderWeekly();}
function registerSW(){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem('ph_install_dismissed'))document.getElementById('installBanner').classList.add('show');});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted')document.getElementById('installBanner').classList.remove('show');deferredPrompt=null;});
window.addEventListener('appinstalled',()=>{document.getElementById('installBanner').classList.remove('show');deferredPrompt=null;});
function dismissInstall(){document.getElementById('installBanner').classList.remove('show');localStorage.setItem('ph_install_dismissed','1');}
document.getElementById('photoModal').addEventListener('click',e=>{if(e.target===document.getElementById('photoModal'))closeModal();});
document.getElementById('fileInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file||!currentDog)return;const reader=new FileReader();reader.onload=ev=>{state.photos[currentDog]=ev.target.result;save();closeModal();renderAll();};reader.readAsDataURL(file);e.target.value='';});
document.getElementById('searchInput').addEventListener('input',renderDays);
load();
const todayDay=allDays().find(d=>isToday(d));
if(todayDay)expandedDays.add(dk(todayDay));
renderAll();renderFilters();registerSW();
</script>
